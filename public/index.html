<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whiteboard — Real-time Collaborative</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- JOIN SCREEN -->
  <div id="join-screen">
    <div class="join-card">
      <div class="join-logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="12" fill="#1a1a2e"/>
          <path d="M10 34 Q16 18 24 24 Q32 30 38 14" stroke="#4ECDC4" stroke-width="3" stroke-linecap="round" fill="none"/>
          <circle cx="24" cy="24" r="3" fill="#FF6B6B"/>
        </svg>
        <h1>Whiteboard</h1>
      </div>
      <p class="join-sub">Real-time collaborative canvas</p>

      <label>Your name
        <input id="name-input" type="text" placeholder="e.g. Alice" maxlength="20" />
      </label>
      <label>Room ID
        <input id="room-input" type="text" placeholder="e.g. my-room" maxlength="40" />
        <small>Share this ID with collaborators</small>
      </label>
      <button id="join-btn">Join Whiteboard →</button>
    </div>
  </div>

  <!-- BOARD SCREEN (hidden by CSS class, not HTML attribute) -->
  <div id="board-screen" class="hidden">

    <!-- Toolbar -->
    <aside id="toolbar">
      <div class="toolbar-section">
        <button class="tool-btn active" data-tool="pen" title="Pen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
          </svg>
        </button>
        <button class="tool-btn" data-tool="eraser" title="Eraser">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M20 20H7L3 16l13-13 7 7-3 10z"/>
          </svg>
        </button>
      </div>

      <div class="toolbar-section">
        <label class="color-wrap" title="Pick color">
          <input id="color-picker" type="color" value="#ffffff" />
          <span class="color-preview" style="background:#ffffff"></span>
        </label>
      </div>

      <div class="toolbar-section">
        <span class="slider-label">Size</span>
        <input id="width-slider" type="range" min="1" max="40" value="4" class="vslider" />
        <span id="width-label">4</span>
      </div>

      <div class="toolbar-section">
        <button class="action-btn" id="undo-btn" title="Undo (Ctrl+Z)">↩</button>
        <button class="action-btn" id="redo-btn" title="Redo (Ctrl+Y)">↪</button>
        <button class="action-btn danger" id="clear-btn" title="Clear all">✕</button>
      </div>

      <div id="status" class="status">⚫ Connecting…</div>
      <div id="room-label" class="room-label"></div>
    </aside>

    <!-- Presence panel -->
    <div id="presence-panel">
      <span class="presence-title">Online</span>
      <ul id="user-list"></ul>
    </div>

    <!-- Canvas area -->
    <main id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div id="cursor-overlay"></div>
    </main>

    <!-- Hint bar -->
    <div id="hint-bar">
      <kbd>Ctrl+Z</kbd> Undo &nbsp;·&nbsp; <kbd>Ctrl+Y</kbd> Redo &nbsp;·&nbsp; Share the URL to invite others
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
